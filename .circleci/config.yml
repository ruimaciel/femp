version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2604:current

    steps:
      - run:
          name: Install base packages
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake git gcc
      - checkout
      - run:
          name: Checkout Git submodules
          command: |
            git submodule init
            git submodule update
      - run:
          name: Install app dependencies
          command: |
            sudo apt-get install -y qtbase5-dev libqt5opengl5-dev libsuitesparse-dev libboost-dev libeigen3-dev flex bison re2c libboost-program-options-dev libgtest-dev ccache

      - restore_cache:
          keys:
            - v1-ccache-{{ .Branch }}-{{ .Revision }}
            - v1-ccache-{{ .Branch }}-
            - v1-ccache-
      - run:
          name: Prepare build directory
          command: |
            mkdir build
            cd build
            cmake -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..
      - run:
          name: Build
          command: |
            export CCACHE_DIR=~/.ccache
            ccache -z
            cmake --build ./build -j 4 > build-output.log 2> compiler-warnings.log
      - store_artifacts:
          path: compiler-warnings.log
          destination: compilation-diagnostics
      - save_cache:
          name: Cache build artifacts
          key: v1-repo-{{ arch }}-{{ .Branch }}-{{ .Environment.CIRCLE_SHA1 }}
          paths:
            - build
      - save_cache:
          name: Cache ccache artifacts
          key: v1-ccache-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.ccache

  test:
    machine:
      image: ubuntu-2604:current
    steps:
      - restore_cache:
          key: v1-repo-{{ arch }}-{{ .Branch }}-{{ .Environment.CIRCLE_SHA1 }}
      
      - run:
          name: Install packages
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake
      - run:
          name: test  libfemp
          command: |
            cd build
            cd libfemp
            ctest

workflows:
  version: 2
  unscheduled:
    jobs:
      - build